name: Update open-source contributions

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-contributions.yml'

permissions:
  contents: write

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh public contribution PRs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64
          import html
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          from urllib.error import HTTPError
          
          START = "<!-- OPEN-SOURCE:START -->"
          END = "<!-- OPEN-SOURCE:END -->"
          OWNER = "NansKong"
          REPO = os.environ["GITHUB_REPOSITORY"]
          TOKEN = os.environ["GH_TOKEN"]
          
          def api(path, data=None):
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  data=json.dumps(data).encode() if data is not None else None,
                  headers={"Authorization": "Bearer " + TOKEN,
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "User-Agent": "profile-contribution-updater"},
                  method="PUT" if data is not None else "GET",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          
          def cell(value):
              value = html.escape(" ".join(value.split()), quote=False)
              return re.sub(r"([\\\[\]\x60])", r"\\\1", value).replace("|", "&#124;")
          
          def render(pulls):
              lines = [
                  "## Open-source contributions", "",
                  "Recent public pull requests to repositories owned by others, ordered by latest activity.",
                  "Open and closed pull requests are shown honestly; only merged work is marked **Merged**.", "",
              ]
              if pulls:
                  lines += ["| Project | Contribution | Status |", "| --- | --- | --- |"]
                  for pr in pulls:
                      repo = pr["base"]["repo"]
                      status = "Merged" if pr.get("merged_at") else ("Open" if pr["state"] == "open" else "Closed (unmerged)")
                      lines.append("| [{repo}]({repo_url}) | [{title} #{number}]({url}) | {status} |".format(
                          repo=cell(repo["full_name"]), repo_url=repo["html_url"],
                          title=cell(pr["title"]), number=pr["number"], url=pr["html_url"], status=status))
              else:
                  lines.append("No public pull requests to other owners' repositories found yet.")
              lines += ["", "[View all public contribution PRs](https://github.com/pulls?q=is%3Apr+author%3ANansKong+-user%3ANansKong+is%3Apublic)",
                        "", "_Refreshed daily by GitHub Actions._"]
              return "\n".join(lines)
          
          def replace_section(readme, section):
              block = START + "\n" + section + "\n" + END
              if START in readme or END in readme:
                  if readme.count(START) != 1 or readme.count(END) != 1 or readme.index(START) >= readme.index(END):
                      raise ValueError("Invalid contribution markers; leaving README unchanged")
                  first, rest = readme.split(START, 1)
                  _, last = rest.split(END, 1)
                  return first + block + last
              anchor = "## Let’s collaborate"
              if anchor in readme:
                  return readme.replace(anchor, block + "\n\n" + anchor, 1)
              return readme.rstrip() + "\n\n" + block + "\n"
          
          def main():
              query = "is:pr is:public author:" + OWNER + " -user:" + OWNER
              result = api("/search/issues?" + urllib.parse.urlencode(
                  {"q": query, "sort": "updated", "order": "desc", "per_page": 10}))
              if result.get("incomplete_results"):
                  raise RuntimeError("Incomplete search; preserving existing section")
              pulls = []
              for item in result["items"]:
                  # Fetch canonical PR data so closed-but-unmerged PRs cannot be labeled merged.
                  path = urllib.parse.urlparse(item["pull_request"]["url"]).path
                  pr = api(path)
                  repo = pr["base"]["repo"]
                  if not repo["private"] and repo["owner"]["login"].lower() != OWNER.lower():
                      pulls.append(pr)
              section = render(pulls)
              for attempt in range(3):
                  current = api("/repos/" + REPO + "/contents/README.md")
                  readme = base64.b64decode(current["content"]).decode("utf-8")
                  updated = replace_section(readme, section)
                  if updated == readme:
                      print("Contribution section is already current.")
                      return
                  try:
                      api("/repos/" + REPO + "/contents/README.md", {
                          "message": "docs: refresh open-source contributions",
                          "content": base64.b64encode(updated.encode("utf-8")).decode("ascii"),
                          "sha": current["sha"],
                      })
                      print("Updated README with " + str(len(pulls)) + " public contribution PRs.")
                      return
                  except HTTPError as error:
                      if error.code != 409 or attempt == 2:
                          raise
                      time.sleep(2)
              raise RuntimeError("README update failed")
          
          if __name__ == "__main__":
              main()
          
